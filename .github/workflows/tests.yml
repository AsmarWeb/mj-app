name: Tests
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: mj_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'mj_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo_mysql, pdo_sqlite, sqlite3, mbstring, gd, intl, zip, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: npm run test:frontend
      - run: php artisan test
